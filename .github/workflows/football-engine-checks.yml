name: Football engine checks
on:
  push:
    branches: [FootballEngineImprovements]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  test-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npx eslint src/engine/coverageRunSupport.js src/engine/scoutThreats.js src/engine/scoring.js src/engine/conceptMatchup.js src/engine/coverageRank.js src/engine/coverageGuidance.js src/engine/callOptions.js tests/runSupport.test.js src/engine/personalizationSafety.js tests/callOptions.test.js src/engine/playMatchup.js src/engine/recommendations.js src/data/playEvidence.js src/data/validatedPlaySnapshot.js tests/playMatchup.test.js tests/conceptMatchup.test.js src/engine/callSelection.js tests/callSelection.test.js src/data/gameObjectives.js src/engine/adjustmentPlan.js src/engine/calibrationLog.js src/engine/buildCallSheet.js tests/gameObjectives.test.js
